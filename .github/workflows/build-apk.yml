name: Build APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm ci

      - name: Prebuild Android native files
        run: npx expo prebuild --platform android --no-install

      - name: Compile APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename Output APK
        run: |
          mkdir -p build-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk build-assets/YGO-Calculator.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: build-assets/YGO-Calculator.apk
          name: Release ${{ github.ref_name }}
          body: |
            Automatic build of YGO-Calculator version ${{ github.ref_name }}.
            
            Install `YGO-Calculator.apk` directly on your Android device to test the tournament calculator.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
